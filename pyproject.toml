[project]
name = "ragpdf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shahbaz Ali", email = "devshahbazali@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "ollama>=0.6.3",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
ragpdf = "ragpdf:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
